<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atual Motos</title>
<style>
:root{--blue:#0b57d0;--dark:#09233f;--bg:#f5f7fb;--text:#182230;--muted:#687385;--green:#159447;--orange:#e99017;--card:#fff;--border:#e3e8ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--dark);color:#fff;padding:10px 5%;font-size:13px;text-align:center}.nav{background:#fff;display:flex;align-items:center;gap:20px;padding:16px 5%;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}.logo{font-weight:900;color:var(--blue);font-size:21px;white-space:nowrap}.search{flex:1;max-width:600px;background:#f1f4f8;border:1px solid var(--border);border-radius:12px;padding:12px 15px}.nav button{border:0;background:transparent;font-weight:700}.cart{position:relative}.badge{position:absolute;top:-7px;right:-9px;background:#e53935;color:#fff;border-radius:99px;font-size:10px;padding:3px 6px}.wrap{max-width:1200px;margin:auto;padding:25px 5%}.hero{background:linear-gradient(110deg,#09233f,#0b57d0);color:#fff;border-radius:20px;padding:42px 7%;display:flex;justify-content:space-between;align-items:center;overflow:hidden}.hero h1{font-size:clamp(30px,5vw,54px);margin:0 0 10px}.hero p{max-width:550px;color:#dce9ff}.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800}.btn.light{background:#fff;color:var(--blue)}.cats,.products{display:grid;gap:15px}.cats{grid-template-columns:repeat(5,1fr);margin:22px 0}.cat,.card,.panel{background:#fff;border:1px solid var(--border);border-radius:15px}.cat{padding:20px;text-align:center;font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.products{grid-template-columns:repeat(4,1fr)}.card{padding:14px}.photo{height:190px;border-radius:12px;background:linear-gradient(145deg,#eef2f6,#d8dee7);display:flex;align-items:center;justify-content:center;font-size:58px}.card h3{font-size:15px;margin:12px 0 6px}.price{font-size:21px;font-weight:900;color:var(--blue)}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;align-items:center}.card .btn{width:100%;margin-top:12px}.hidden{display:none!important}.screen{min-height:70vh}.crumb{font-size:13px;color:var(--muted);margin-bottom:18px}.product-page{display:grid;grid-template-columns:1fr 1fr;gap:35px}.bigphoto{height:480px;border-radius:18px;background:linear-gradient(145deg,#eef2f6,#d8dee7);display:flex;align-items:center;justify-content:center;font-size:120px}.info h1{font-size:32px}.stock{color:var(--green);font-weight:800}.paybox,.pickup,.summary{border:1px solid var(--border);background:#fff;border-radius:15px;padding:18px;margin-top:18px}.qty{display:flex;align-items:center;gap:12px}.qty button{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px}.cartline{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.mini{height:70px;border-radius:10px;background:#e9edf2;display:flex;align-items:center;justify-content:center;font-size:30px}.checkout{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.steps{display:flex;gap:7px;margin-bottom:20px}.step{flex:1;text-align:center;padding:9px;background:#e9eef6;border-radius:9px;font-size:12px;font-weight:800}.step.active{background:var(--blue);color:#fff}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.slot{padding:14px;border:1px solid var(--border);background:#fff;border-radius:10px;text-align:left}.slot.selected{border:2px solid var(--blue);background:#eef5ff}.slot small{display:block;color:var(--green);margin-top:5px}.admin{display:grid;grid-template-columns:220px 1fr;min-height:70vh}.side{background:var(--dark);color:#fff;padding:20px;border-radius:16px 0 0 16px}.side button{display:block;width:100%;padding:12px;border:0;background:transparent;color:#fff;text-align:left;border-radius:8px}.side button.active{background:#174d87}.dash{padding:0 0 0 20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:18px;background:#fff;border:1px solid var(--border);border-radius:14px}.metric strong{display:block;font-size:23px;margin-top:6px}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--border);font-size:13px}.footer{background:var(--dark);color:#cbd8e8;margin-top:50px;padding:35px 5%;text-align:center}@media(max-width:800px){.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.cats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}.product-page,.checkout{grid-template-columns:1fr}.bigphoto{height:300px}.admin{grid-template-columns:1fr}.side{border-radius:16px;margin-bottom:15px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:18px 4%}.products{grid-template-columns:1fr 1fr}.photo{height:140px}.hero{padding:30px 7%}.hero h1{font-size:32px}.metrics{grid-template-columns:1fr 1fr}.slots{grid-template-columns:1fr}}
</style></head>
<body>
<div class="top">🚚 Retirada na loja • Pagamento online • Compra segura</div>
<header class="nav"><div class="logo">⚙️ SUA LOJA</div><input class="search" id="search" placeholder="O que você está procurando?" oninput="renderHome()"><button onclick="show('home')">Início</button><button onclick="show('admin')">Admin</button><button class="cart" onclick="show('cart')">🛒 <span class="badge" id="badge">0</span></button></header>
<main id="app"></main>
<footer class="footer">Sua Loja • Protótipo inicial • Compra online e retirada na loja</footer>
<script>
let products=JSON.parse(localStorage.products||'null')||[{id:1,name:'Disco de Freio Dianteiro Titan 150',price:89.9,icon:'⚙️',cat:'Peças',stock:15,desc:'Disco de freio de alta resistência e durabilidade.'},{id:2,name:'Capacete Aberto Pro Tork',price:149.9,icon:'⛑️',cat:'Acessórios',stock:8,desc:'Capacete confortável para uso diário.'},{id:3,name:'Óleo de Motor 10W40',price:24.9,icon:'🛢️',cat:'Lubrificantes',stock:20,desc:'Lubrificante para motores de motocicletas.'},{id:4,name:'Kit Ferramentas 5 peças',price:129.9,icon:'🔧',cat:'Ferramentas',stock:5,desc:'Kit compacto para manutenção.'}];let cart=JSON.parse(localStorage.cart||'[]');let selectedSlot='13:00 - 15:00';let order=null;
const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const total=()=>cart.reduce((s,x)=>s+x.price*x.qty,0);function updateBadge(){document.getElementById('badge').textContent=cart.reduce((s,x)=>s+x.qty,0)}function save(){localStorage.cart=JSON.stringify(cart);updateBadge()}
function show(page,data){if(page==='home')renderHome();if(page==='product')renderProduct(data);if(page==='cart')renderCart();if(page==='checkout')renderCheckout();if(page==='success')renderSuccess();if(page==='admin')renderAdmin();scrollTo(0,0)}
function renderHome(){let q=(document.getElementById('search')?.value||'').toLowerCase();let ps=products.filter(p=>(p.name+p.cat).toLowerCase().includes(q));document.getElementById('app').innerHTML=`<div class="wrap screen"><section class="hero"><div><h1>Compre online.<br>Retire na loja.</h1><p>Escolha seus produtos, pague pelo site e agende o melhor horário para retirar.</p><button class="btn light" onclick="document.getElementById('products').scrollIntoView()">Ver produtos</button></div><div style="font-size:100px">🛍️</div></section><div class="cats">${['Peças','Acessórios','Ferramentas','Lubrificantes','Equipamentos'].map(x=>`<div class="cat">${x}</div>`).join('')}</div><div class="section-title"><h2>Ofertas e produtos</h2><span class="muted">${ps.length} produtos</span></div><div id="products" class="products">${ps.map(card).join('')}</div></div>`;updateBadge()}
function card(p){return `<article class="card"><div class="photo">${p.icon}</div><h3>${p.name}</h3><div class="muted">${p.stock} em estoque</div><div class="price">${money(p.price)}</div><div class="muted">ou até 10x sem juros</div><button class="btn" onclick="show('product',${p.id})">Ver produto</button></article>`}
function renderProduct(id){let p=products.find(x=>x.id===id);document.getElementById('app').innerHTML=`<div class="wrap screen"><div class="crumb">Início › ${p.cat} › ${p.name}</div><div class="product-page"><div class="bigphoto">${p.icon}</div><div class="info"><h1>${p.name}</h1><div class="stock">● Disponível em estoque (${p.stock} unidades)</div><div class="price" style="font-size:34px;margin:15px 0">${money(p.price)}</div><div class="muted">Pix ou cartão de crédito</div><div class="qty" style="margin:20px 0"><button onclick="chg(-1)">−</button><strong id="q">1</strong><button onclick="chg(1)">+</button></div><button class="btn" style="width:100%" onclick="add(${p.id})">Comprar agora</button><div class="pickup"><strong>🏪 Retirar na loja</strong><p class="muted">Escolha o dia e horário durante o checkout.</p></div><div class="paybox"><strong>Descrição</strong><p>${p.desc}</p></div></div></div></div>`;window.currentQty=1}
function chg(n){window.currentQty=Math.max(1,(window.currentQty||1)+n);document.getElementById('q').textContent=window.currentQty}function add(id){let p=products.find(x=>x.id===id),q=window.currentQty||1,old=cart.find(x=>x.id===id);if(old)old.qty+=q;else cart.push({...p,qty:q});save();show('cart')}
function renderCart(){let lines=cart.length?cart.map(x=>`<div class="cartline"><div class="mini">${x.icon}</div><div><strong>${x.name}</strong><div class="muted">${money(x.price)} × ${x.qty}</div></div><strong>${money(x.price*x.qty)}</strong></div>`).join(''):`<div class="panel" style="padding:40px;text-align:center">Seu carrinho está vazio.<br><button class="btn" style="margin-top:15px" onclick="show('home')">Continuar comprando</button></div>`;document.getElementById('app').innerHTML=`<div class="wrap screen"><h1>Meu carrinho</h1><div class="checkout"><div class="panel" style="padding:20px">${lines}</div><div class="summary"><h3>Resumo do pedido</h3><div class="row" style="justify-content:space-between"><span>Produtos</span><strong>${money(total())}</strong></div><div class="row" style="justify-content:space-between;margin-top:10px"><span>Retirada</span><strong>Grátis</strong></div><hr><div class="row" style="justify-content:space-between"><strong>Total</strong><strong class="price">${money(total())}</strong></div><button class="btn" style="width:100%;margin-top:18px" ${!cart.length?'disabled':''} onclick="show('checkout')">Continuar</button></div></div></div>`}
function renderCheckout(){document.getElementById('app').innerHTML=`<div class="wrap screen"><div class="steps"><div class="step active">1 Carrinho</div><div class="step active">2 Retirada</div><div class="step">3 Pagamento</div><div class="step">4 Confirmação</div></div><div class="checkout"><div class="panel" style="padding:20px"><h2>Escolha o dia e horário da retirada</h2><label>Local de retirada</label><select style="width:100%;padding:12px;margin:7px 0 18px"><option>Loja física — endereço principal</option></select><label>Data</label><input type="date" id="date" value="2026-10-05" style="width:100%;padding:12px;margin:7px 0 18px"><h3>Horário</h3><div class="slots">${['08:00 - 10:00','10:00 - 12:00','13:00 - 15:00','15:00 - 17:00'].map(s=>`<button class="slot ${s===selectedSlot?'selected':''}" onclick="selectSlot('${s}')">${s}<small>3 vagas disponíveis</small></button>`).join('')}</div><h2 style="margin-top:30px">Pagamento</h2><label><input type="radio" checked> Pix — pagamento instantâneo</label><br><br><label><input type="radio"> Cartão de crédito</label><button class="btn" style="width:100%;margin-top:25px" onclick="finishOrder()">Finalizar pedido</button></div><div class="summary"><h3>Resumo</h3>${cart.map(x=>`<div class="row" style="justify-content:space-between;margin:8px 0"><span>${x.qty}× ${x.name}</span><strong>${money(x.qty*x.price)}</strong></div>`).join('')}<hr><strong>Total ${money(total())}</strong><p class="muted">Retirada gratuita na loja.</p></div></div></div>`}
function selectSlot(s){selectedSlot=s;renderCheckout()}function finishOrder(){order={number:Math.floor(1000+Math.random()*8999),date:document.getElementById('date').value,slot:selectedSlot,total:total()};cart=[];save();show('success')}
function renderSuccess(){document.getElementById('app').innerHTML=`<div class="wrap screen"><div class="panel" style="max-width:650px;margin:40px auto;padding:45px;text-align:center"><div style="font-size:70px">✅</div><h1>Pagamento aprovado!</h1><p>Pedido <strong>#${order.number}</strong> confirmado.</p><div class="pickup" style="text-align:left"><strong>🏪 Retirada na loja</strong><p>📅 ${order.date}<br>🕐 ${order.slot}<br>💰 ${money(order.total)}</p></div><p class="muted">Você receberá uma confirmação e um aviso quando o pedido estiver pronto.</p><button class="btn" onclick="show('home')">Voltar para a loja</button></div></div>`}
function adminMenu(active){return `<aside class="side"><h2>⚙️ Sua Loja</h2><button class="${active==='dashboard'?'active':''}" onclick="adminPage('dashboard')">Dashboard</button><button class="${active==='pedidos'?'active':''}" onclick="adminPage('pedidos')">Pedidos</button><button class="${active==='produtos'?'active':''}" onclick="adminPage('produtos')">Produtos</button><button class="${active==='estoque'?'active':''}" onclick="adminPage('estoque')">Estoque</button><button class="${active==='clientes'?'active':''}" onclick="adminPage('clientes')">Clientes</button><button class="${active==='retiradas'?'active':''}" onclick="adminPage('retiradas')">Retiradas</button><button class="${active==='relatorios'?'active':''}" onclick="adminPage('relatorios')">Relatórios</button><button class="${active==='config'?'active':''}" onclick="adminPage('config')">Configurações</button></aside>`}
function adminLayout(active,content){document.getElementById('app').innerHTML=`<div class="wrap screen"><div class="admin">${adminMenu(active)}<section class="dash">${content}</section></div></div>`;scrollTo(0,0)}
function adminPage(page){if(page==='dashboard')return renderAdmin();if(page==='produtos')return renderAdminProducts();if(page==='estoque')return renderAdminStock();if(page==='pedidos')return renderAdminOrders();if(page==='clientes')return renderAdminClients();if(page==='retiradas')return renderAdminPickups();if(page==='relatorios')return renderAdminReports();if(page==='config')return renderAdminConfig()}
function renderAdmin(){adminLayout('dashboard',`<h1>Dashboard</h1><div class="metrics"><div class="metric">Vendas hoje<strong>${money(3428.5)}</strong></div><div class="metric">Pedidos<strong>27</strong></div><div class="metric">Aguardando<strong>3</strong></div><div class="metric">Prontos<strong>6</strong></div></div><h2>Pedidos para hoje</h2><table class="table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Horário</th><th>Situação</th></tr></thead><tbody><tr><td>#1051</td><td>João Silva</td><td>09:00–10:00</td><td>🟢 Pronto</td></tr><tr><td>#1052</td><td>Maria Souza</td><td>10:00–12:00</td><td>🟡 Separando</td></tr><tr><td>#1053</td><td>Carlos Lima</td><td>13:00–15:00</td><td>🟢 Pronto</td></tr></tbody></table><h2>Estoque</h2><table class="table"><thead><tr><th>Produto</th><th>Estoque</th><th>Preço</th><th>Status</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${money(p.price)}</td><td>🟢 Ativo</td></tr>`).join('')}</tbody></table>`)}
function renderAdminProducts(){adminLayout('produtos',`<h1>Produtos</h1><div class="panel" style="padding:20px;margin-bottom:20px"><h2>Cadastrar produto</h2><input id="pn" placeholder="Nome do produto" style="width:100%;padding:12px;margin:6px 0"><input id="pp" type="number" step="0.01" placeholder="Preço" style="width:100%;padding:12px;margin:6px 0"><input id="ps" type="number" placeholder="Estoque" style="width:100%;padding:12px;margin:6px 0"><select id="pc" style="width:100%;padding:12px;margin:6px 0"><option>Peças</option><option>Acessórios</option><option>Ferramentas</option><option>Lubrificantes</option><option>Equipamentos</option></select><button class="btn" onclick="addProductAdmin()">Adicionar produto</button></div><table class="table"><thead><tr><th>Produto</th><th>Preço</th><th>Estoque</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.icon} ${p.name}</td><td>${money(p.price)}</td><td>${p.stock}</td></tr>`).join('')}</tbody></table>`)}
function addProductAdmin(){let name=document.getElementById('pn').value.trim(),price=Number(document.getElementById('pp').value),stock=Number(document.getElementById('ps').value),cat=document.getElementById('pc').value;if(!name||!price)return alert('Informe nome e preço.');products.push({id:Date.now(),name,price,icon:'📦',cat,stock,desc:'Novo produto cadastrado.'});localStorage.products=JSON.stringify(products);renderAdminProducts()}
function renderAdminStock(){adminLayout('estoque',`<h1>Estoque</h1><table class="table"><thead><tr><th>Produto</th><th>Estoque</th><th>Ajustar</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td><button class="btn" onclick="changeStock(${p.id},-1)">−</button> <button class="btn" onclick="changeStock(${p.id},1)">+</button></td></tr>`).join('')}</tbody></table>`)}
function changeStock(id,n){let p=products.find(x=>x.id===id);if(p){p.stock=Math.max(0,p.stock+n);localStorage.products=JSON.stringify(products);renderAdminStock()}}
function renderAdminOrders(){adminLayout('pedidos',`<h1>Pedidos</h1><table class="table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Horário</th><th>Status</th></tr></thead><tbody><tr><td>#1051</td><td>João Silva</td><td>09:00–10:00</td><td>🟢 Pronto</td></tr><tr><td>#1052</td><td>Maria Souza</td><td>10:00–12:00</td><td>🟡 Separando</td></tr><tr><td>#1053</td><td>Carlos Lima</td><td>13:00–15:00</td><td>🟢 Pronto</td></tr></tbody></table>`)}
function renderAdminClients(){adminLayout('clientes',`<h1>Clientes</h1><div class="panel" style="padding:20px"><p><strong>João Silva</strong><br>Pedidos: 8</p><p><strong>Maria Souza</strong><br>Pedidos: 5</p><p><strong>Carlos Lima</strong><br>Pedidos: 3</p></div>`)}
function renderAdminPickups(){adminLayout('retiradas',`<h1>Retiradas</h1><div class="panel" style="padding:20px"><p>📦 <strong>#1051</strong> — 09:00–10:00 — Pronto</p><p>📦 <strong>#1052</strong> — 10:00–12:00 — Separando</p><p>📦 <strong>#1053</strong> — 13:00–15:00 — Pronto</p></div>`)}
function renderAdminReports(){adminLayout('relatorios',`<h1>Relatórios</h1><div class="metrics"><div class="metric">Vendas hoje<strong>${money(3428.5)}</strong></div><div class="metric">Pedidos<strong>27</strong></div><div class="metric">Ticket médio<strong>${money(127.35)}</strong></div></div>`)}
function renderAdminConfig(){adminLayout('config',`<h1>Configurações</h1><div class="panel" style="padding:20px"><label>Nome da loja</label><input value="Sua Loja" style="width:100%;padding:12px;margin:8px 0 18px"><label>Mensagem</label><textarea style="width:100%;padding:12px;margin:8px 0" rows="4">Retirada na loja • Pagamento online • Compra segura</textarea><button class="btn" onclick="alert('Configurações salvas neste protótipo.')">Salvar</button></div>`)}

renderHome();updateBadge();
console.log("Painel administrativo em teste");
console.log("100");
console.log("Admin Atual Motos funcionando");
  
</script></body></html>
